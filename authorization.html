<html lang="ru">

<head>
	<meta charset="utf-8" />
	<title>Заголовок</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="format-detection" content="telephone=no" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/main.css?ver=1.1" />
</head>
<body>

	<div class="wrapper">

		<div class="auth">
			<div class="auth__content auth__content--main">
				<div class="auth__head">
					<img src="img/logo.svg" alt="alt">
				</div>
				<div class="title-main">Авторизация</div>
				<form>
					<div class="item-form">
						<div class="item-form__title">Email</div>
						<input type="text" placeholder="Введите свой Email" inputmode="email" required>
						<div class="clear-input"></div>
					</div>
					<button class="btn-main btn-main--auth" type="submit">Войти</button>
					<div class="text-error"></div>
				</form>
			</div>
			<div class="auth__content auth__content--thanks">
				<div class="auth__head">
					<img src="img/logo.svg" alt="alt">
				</div>
				<div class="thanks-content">
					<div class="thanks-content__icon"></div>
					<div class="title-main">Проверьте свой Email</div>
					<div class="thanks-content__text">
						<p>Мы отправили сообщение на адрес <br><strong>andrei.tsybuk@gmail.com</strong></p>
						<p>Щелкните ссылку в письме, <br>чтобы войти в магазин.</p>
					</div>
				</div>
			</div>
		</div>
		
	</div>

	<script src="js/common.js?ver=1.1"></script>
</body>
